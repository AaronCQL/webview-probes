name: env
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/env.yml"]
concurrency:
  group: env-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - run: |
          sw_vers; uname -a; sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          xcodebuild -version; xcode-select -p; ls /Applications | grep -i xcode
          swift --version
          xcrun --sdk iphonesimulator --show-sdk-path
          xcrun simctl list runtimes
          xcrun simctl list devices available | head -40
          which go zig rustup cargo clang python3 || true
          go version || true; rustup --version || true; rustup target list --installed || true
          defaults read /System/Library/Frameworks/WebKit.framework/Resources/Info.plist CFBundleVersion || true
          who; launchctl managername || true
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - shell: pwsh
        run: |
          [System.Environment]::OSVersion
          Get-ComputerInfo -Property OsName,OsVersion,OsBuildNumber | Format-List
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue | Select-Object pv,name
          dotnet --list-sdks
          Get-Command gcc,clang,cl,go,zig,cargo,rustup,python -ErrorAction SilentlyContinue | Format-Table Name,Source
          go version; rustup --version; rustup target list --installed
          gcc --version | Select-Object -First 1
          clang --version | Select-Object -First 1
          Test-Path C:\mingw64\bin\gcc.exe
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfLogicalProcessors
          query user 2>&1
