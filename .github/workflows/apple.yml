name: apple
on:
  workflow_dispatch:
  push:
    paths: ["apple/**", "web/**", "modules/**", "tools/**", ".github/workflows/apple.yml"]
concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: env
        run: sw_vers; xcodebuild -version; defaults read /System/Library/Frameworks/WebKit.framework/Resources/Info.plist CFBundleVersion
      - name: build
        run: apple/build-macos.sh
      - name: main suite (A1-A4, A6)
        run: perl -e 'alarm shift; exec @ARGV' 300 build/macos/probe --web web --mode main --timeout 240 2>&1 | tee mac-main.log || true
      - name: throttle default
        run: perl -e 'alarm shift; exec @ARGV' 200 build/macos/probe --web web --mode throttle --config default --hidden-secs 90 2>&1 | tee mac-throttle-default.log || true
      - name: throttle inactiveSchedulingPolicy=none
        run: perl -e 'alarm shift; exec @ARGV' 200 build/macos/probe --web web --mode throttle --config nosuspend --hidden-secs 90 2>&1 | tee mac-throttle-nosuspend.log || true
      - name: throttle private prefs
        run: perl -e 'alarm shift; exec @ARGV' 200 build/macos/probe --web web --mode throttle --config private --hidden-secs 90 2>&1 | tee mac-throttle-private.log || true
      - name: throttle all
        run: perl -e 'alarm shift; exec @ARGV' 200 build/macos/probe --web web --mode throttle --config all --hidden-secs 90 2>&1 | tee mac-throttle-all.log || true
      - name: collect
        if: always()
        run: python3 tools/collect.py macos-results.json main=mac-main.log throttle_default=mac-throttle-default.log throttle_nosuspend=mac-throttle-nosuspend.log throttle_private=mac-throttle-private.log throttle_all=mac-throttle-all.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-results
          path: |
            macos-results.json
            mac-*.log
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: modules/go/go.mod
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            modules/rust/target
          key: cargo-ios-${{ hashFiles('modules/rust/**') }}
      - name: build modules + app
        run: apple/build-ios.sh
      - name: modules (B1)
        run: apple/run-ios.sh ios-modules.log 180 --mode modules
      - name: webview suite (B2)
        run: apple/run-ios.sh ios-main.log 360 --mode main --modules 0 --timeout 300
      - name: collect
        if: always()
        run: |
          cat build/ios/status.txt || true
          python3 tools/collect.py ios-results.json modules=ios-modules.log main=ios-main.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-results
          path: |
            ios-results.json
            ios-*.log
            build/ios/*.txt
            build/ios/*.log
